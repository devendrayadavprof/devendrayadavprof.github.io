# Updates scholar.json with your Google Scholar citations, h-index and i10-index.
# Runs every Monday, and whenever you click "Run workflow" on the Actions tab.
# Needs a repository secret named SERPAPI_KEY (Settings > Secrets and variables > Actions).
name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_ID: gJgesicAAAAJ
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.parse, urllib.request, datetime
          key = os.environ.get("SERPAPI_KEY", "").strip()
          if not key:
              sys.exit("SERPAPI_KEY secret is missing")
          q = urllib.parse.urlencode({"engine": "google_scholar_author",
                                      "author_id": os.environ["SCHOLAR_ID"],
                                      "hl": "en", "num": 100, "api_key": key})
          with urllib.request.urlopen("https://serpapi.com/search.json?" + q, timeout=60) as r:
              data = json.load(r)
          if "error" in data:
              sys.exit("SerpApi error: " + str(data["error"]))
          table = (data.get("cited_by") or {}).get("table") or []
          def pick(name):
              for row in table:
                  if name in row:
                      return int(row[name].get("all") or 0)
              return None
          out = {"citations": pick("citations"), "h_index": pick("h_index"),
                 "i10_index": pick("i10_index"),
                 "updated": datetime.date.today().isoformat(),
                 "source": "Google Scholar",
                 "articles": [{"title": x.get("title", ""), "year": x.get("year", ""),
                               "cited_by": int(((x.get("cited_by") or {}).get("value")) or 0)}
                              for x in data.get("articles") or []]}
          if out["citations"] is None:
              sys.exit("No citation table in the response")
          json.dump(out, open("scholar.json", "w"), indent=2)
          print(out)
          EOF

      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add scholar.json
          git diff --cached --quiet || git commit -m "Update Google Scholar metrics"
          git push
